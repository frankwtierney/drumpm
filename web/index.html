<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum Pitch Match</title>
<style>
  :root { --bg:#111214; --panel:#1b1d21; --line:#2c2f36; --text:#e8e9ec; --dim:#8b909a; --accent:#ff7a3d; --ok:#5ad19a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f1; --panel:#fff; --line:#d9d9d2; --text:#1a1b1e; --dim:#666; --accent:#d9531e; --ok:#16875a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,sans-serif; }
  main { max-width:900px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px) { .row { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .drop { border:2px dashed var(--line); border-radius:8px; padding:18px; text-align:center; color:var(--dim); cursor:pointer; }
  .drop.over { border-color:var(--accent); color:var(--text); }
  .label { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-bottom:8px; }
  .pitch { font-size:34px; font-weight:700; margin:10px 0 0; }
  .sub { color:var(--dim); font-size:13px; }
  canvas { width:100%; height:90px; display:block; margin-top:10px; background:var(--bg); border-radius:6px; }
  button { background:var(--accent); color:#111; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:default; }
  .controls { margin-top:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; align-items:end; }
  label { display:block; font-size:13px; color:var(--dim); }
  input[type=range], select { width:100%; }
  .actions { margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; }
  .peaks { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .peaks button { padding:3px 8px; font-size:12px; }
  .peaks button.sel { background:var(--accent); color:#111; }
  .big { font-size:22px; font-weight:700; color:var(--ok); }
  #status { color:var(--dim); font-size:13px; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
<main>
  <h1>Drum Pitch Match</h1>
  <div class="row">
    <div class="card" id="cardA"><div class="label">A: reference (detect pitch)</div><div class="drop" data-slot="A">Drop sample A here, or click</div><div class="pitch" id="pA">-</div><div class="sub" id="sA"></div><div class="peaks" id="kA"></div><canvas id="cA"></canvas><div class="actions"><button class="ghost" id="playA" disabled>Play A</button></div></div>
    <div class="card" id="cardB"><div class="label">B: sample to retune</div><div class="drop" data-slot="B">Drop sample B here, or click</div><div class="pitch" id="pB">-</div><div class="sub" id="sB"></div><div class="peaks" id="kB"></div><canvas id="cB"></canvas><div class="actions"><button class="ghost" id="playB" disabled>Play B</button></div></div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="label">Match B to A</div>
    <div class="big" id="distance"></div>
    <div class="sub" id="shiftInfo">Load both samples</div>
    <div class="controls">
      <label>Mode<select id="mode"><option value="stretch">Time-preserving (Signalsmith)</option><option value="vari">Varispeed (pitch + length change)</option></select></label>
      <label>Fine offset: <span id="fineV">0</span> cents<input type="range" id="fine" min="-100" max="100" value="0"></label>
      <label>Keep original attack: <span id="atkV">0</span> ms<input type="range" id="atk" min="0" max="40" value="0"></label>
      <label><input type="checkbox" id="fold"> Fold to nearest octave (shift at most ±6 st)</label>
    </div>
    <div class="actions"><button id="playM" disabled>Play matched B</button><button class="ghost" id="dl" disabled>Download WAV</button></div>
    <div id="status"></div>
  </div>
  <input type="file" id="file" accept="audio/*" hidden>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
