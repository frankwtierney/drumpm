<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum Pitch Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#08090a; --fg:#f4f4f5; --dim:#74777e; --faint:#2a2c31; --hair:#ffffff14;
    --a:#f4f4f5; --b:#7ef0cf;
    --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; min-height:100vh; color:var(--fg); font:300 14px/1.5 var(--sans); -webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 500px at 50% -10%, #17191f 0%, transparent 70%), var(--bg); }
  .wrap { max-width:1120px; margin:0 auto; padding:34px 28px 56px; }

  header { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .brand { font:200 17px var(--sans); letter-spacing:.42em; text-transform:uppercase; }
  .brand i { font-style:normal; color:var(--b); }
  .opts { display:flex; gap:26px; align-items:center; }

  button, select, .toggle { font:400 10px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
    background:none; border:0; padding:0; cursor:pointer; transition:color .2s, border-color .2s, background .2s; }
  button:hover, select:hover, .toggle:hover { color:var(--fg); }
  button:disabled { opacity:.3; cursor:default; pointer-events:none; }
  select { appearance:none; -webkit-appearance:none; border-bottom:1px solid var(--faint); padding:4px 0; color:var(--fg); }
  select option { background:#15171a; color:var(--fg); }
  .toggle { display:inline-flex; align-items:center; gap:9px; user-select:none; }
  .toggle input { display:none; }
  .toggle::before { content:''; width:7px; height:7px; border-radius:50%; border:1px solid var(--dim); transition:.2s; }
  .toggle:has(input:checked) { color:var(--fg); }
  .toggle:has(input:checked)::before { background:var(--b); border-color:var(--b); box-shadow:0 0 8px var(--b); }
  .btn { border:1px solid var(--faint); border-radius:999px; padding:11px 22px; color:var(--fg); }
  .btn:hover { border-color:#ffffff55; }
  .btn.solid { background:var(--fg); color:#0a0a0b; border-color:var(--fg); font-weight:400; }
  .btn.solid:hover { background:#fff; box-shadow:0 0 30px #ffffff30; }
  .btn.sm { padding:8px 16px; }

  .stage { display:grid; grid-template-columns:1fr minmax(250px,320px) 1fr; gap:36px; margin-top:44px; align-items:start; }
  @media (max-width:940px) { .stage { grid-template-columns:1fr 1fr; } .center { grid-column:1 / -1; order:3; } }
  @media (max-width:600px) { .stage { grid-template-columns:1fr; } }

  .label { font:400 10px var(--mono); letter-spacing:.26em; text-transform:uppercase; color:var(--dim); text-align:center; }
  .voice.a { --c:var(--a); } .voice.b { --c:var(--b); }
  .ringbox { position:relative; width:min(290px,100%); aspect-ratio:1; margin:18px auto 0; cursor:pointer; }
  .ringbox svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .ringbox .track { fill:none; stroke:var(--faint); stroke-width:1; }
  .ringbox .arc { fill:none; stroke:var(--c); stroke-width:2; stroke-linecap:round; transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1); }
  .voice.b .arc, .voice.b .dot circle { filter:drop-shadow(0 0 5px #7ef0cf88); }
  .dot { transition:transform .6s cubic-bezier(.2,.8,.2,1); transform-origin:100px 100px; }
  .dot circle { fill:var(--bg); stroke:var(--c); stroke-width:1.5; }
  .ringbox::after { content:''; position:absolute; inset:-10px; border-radius:50%; border:1px dashed transparent; transition:.2s; pointer-events:none; }
  .ringbox.over::after, .ringbox:hover::after { border-color:#ffffff22; }
  .inner { position:absolute; inset:0; display:grid; place-content:center; text-align:center; pointer-events:none; }
  .note { font:200 clamp(54px,8vw,76px)/1 var(--sans); letter-spacing:-.02em; }
  .cents { margin-top:8px; font:300 11px var(--mono); letter-spacing:.16em; color:var(--dim); }
  .hz { text-align:center; margin-top:22px; font:300 13px var(--mono); letter-spacing:.2em; color:var(--fg); }
  .meta { text-align:center; margin-top:4px; font:300 10px var(--mono); letter-spacing:.1em; color:var(--dim); min-height:15px; word-break:break-word; }
  .peaks { display:flex; flex-wrap:wrap; justify-content:center; gap:4px 16px; margin:14px 0 6px; min-height:22px; }
  .peaks button { font-size:9px; padding:2px 0; border-bottom:1px solid transparent; }
  .peaks button.sel { color:var(--c); border-color:var(--c); }
  canvas { width:100%; height:52px; display:block; margin-top:8px; opacity:.9; }
  .row { display:flex; gap:22px; justify-content:center; align-items:center; margin-top:18px; }

  .center { display:flex; flex-direction:column; gap:30px; text-align:center; padding-top:26px; }
  .big { font:200 clamp(60px,9vw,92px)/1 var(--sans); letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .big small { font:300 11px var(--mono); letter-spacing:.2em; color:var(--dim); margin-left:8px; vertical-align:middle; }
  .verdict { margin-top:14px; font:300 13px/1.7 var(--sans); color:var(--dim); letter-spacing:.04em; min-height:46px; }
  .verdict em { font-style:normal; color:var(--fg); }
  .verdict .dn { color:var(--b); } .verdict .up { color:var(--a); }
  .ctl .h { display:flex; justify-content:space-between; font:400 10px var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-bottom:12px; }
  .ctl .h b { color:var(--fg); font-weight:300; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:20px; background:transparent; outline:none; margin:0; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track { height:1px; background:linear-gradient(90deg,var(--faint) var(--s,0%),var(--fg) var(--s,0%),var(--fg) var(--e,0%),var(--faint) var(--e,0%)); }
  input[type=range]::-moz-range-track { height:1px; background:linear-gradient(90deg,var(--faint) var(--s,0%),var(--fg) var(--s,0%),var(--fg) var(--e,0%),var(--faint) var(--e,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; margin-top:-6px; border-radius:50%; background:var(--fg); border:0; box-shadow:0 0 0 5px #ffffff10; transition:box-shadow .2s; }
  input[type=range]:hover::-webkit-slider-thumb { box-shadow:0 0 0 7px #ffffff18; }
  input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:var(--fg); border:0; }
  .tools { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  #status { min-height:14px; font:300 9px var(--mono); letter-spacing:.24em; color:var(--dim); text-transform:uppercase; }

  .strip { margin-top:52px; border-top:1px solid var(--hair); padding-top:26px; }
  .strip svg { width:100%; height:64px; display:block; overflow:visible; }
  .strip text { font:400 9px var(--mono); letter-spacing:.2em; fill:var(--dim); }
  .strip .scale { stroke:var(--faint); stroke-width:1; }
  .strip .st { stroke:var(--faint); }
  .strip .gap { stroke:var(--fg); stroke-width:1.5; opacity:.7; transition:all .6s cubic-bezier(.2,.8,.2,1); }
  .strip circle { transition:cx .6s cubic-bezier(.2,.8,.2,1); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">drum<i>/</i>pitch</div>
    <div class="opts">
      <select id="mode" title="Pitch shift mode">
        <option value="stretch">Time-preserving</option>
        <option value="vari">Varispeed</option>
      </select>
      <label class="toggle"><input type="checkbox" id="fold">Fold octave</label>
    </div>
  </header>

  <div class="stage">
    <section class="voice a">
      <div class="label">A &middot; reference</div>
      <div class="ringbox drop" data-slot="A">
        <svg viewBox="0 0 200 200" data-knob="A">
          <circle class="track" cx="100" cy="100" r="88" stroke-dasharray="415 600" transform="rotate(135 100 100)"/>
          <circle class="arc" cx="100" cy="100" r="88" stroke-dasharray="0 600" transform="rotate(135 100 100)"/>
          <g class="dot"><circle cx="100" cy="12" r="4.5"/></g>
        </svg>
        <div class="inner"><div class="note" id="pA">&ndash;</div><div class="cents" id="cenA">DROP SAMPLE</div></div>
      </div>
      <div class="hz" id="hzA">&nbsp;</div>
      <div class="meta" id="sA"></div>
      <div class="peaks" id="kA"></div>
      <canvas id="cA"></canvas>
      <div class="row"><button id="playA" disabled>Play</button><button id="earA" disabled>Check by ear</button><select id="octA" title="Play down octaves"><option value="0">0 oct</option><option value="-12">-1 oct</option><option value="-24">-2 oct</option></select></div>
    </section>

    <section class="center">
      <div>
        <div class="label">B relative to A</div>
        <div style="margin-top:22px"><span class="big" id="shiftBig">&ndash;</span><small class="big" style="font-size:11px">ST</small></div>
        <div class="verdict" id="distance">Load both samples</div>
        <div class="label" id="shiftInfo" style="margin-top:2px"></div>
      </div>
      <div class="ctl"><div class="h">Fine <b><span id="fineV">0</span> cents</b></div><input type="range" id="fine" min="-100" max="100" value="0"></div>
      <div class="ctl"><div class="h">Keep attack <b><span id="atkV">0</span> ms</b></div><input type="range" id="atk" min="0" max="40" value="0"></div>
      <div class="tools"><button class="btn solid" id="playM" disabled>Play matched</button><button class="btn" id="dl" disabled>Download</button></div>
      <div id="status"></div>
    </section>

    <section class="voice b">
      <div class="label">B &middot; to retune</div>
      <div class="ringbox drop" data-slot="B">
        <svg viewBox="0 0 200 200" data-knob="B">
          <circle class="track" cx="100" cy="100" r="88" stroke-dasharray="415 600" transform="rotate(135 100 100)"/>
          <circle class="arc" cx="100" cy="100" r="88" stroke-dasharray="0 600" transform="rotate(135 100 100)"/>
          <g class="dot"><circle cx="100" cy="12" r="4.5"/></g>
        </svg>
        <div class="inner"><div class="note" id="pB">&ndash;</div><div class="cents" id="cenB">DROP SAMPLE</div></div>
      </div>
      <div class="hz" id="hzB">&nbsp;</div>
      <div class="meta" id="sB"></div>
      <div class="peaks" id="kB"></div>
      <canvas id="cB"></canvas>
      <div class="row"><button id="playB" disabled>Play</button><button id="earB" disabled>Check by ear</button><select id="octB" title="Play down octaves"><option value="0">0 oct</option><option value="-12">-1 oct</option><option value="-24">-2 oct</option></select></div>
    </section>
  </div>

  <div class="strip">
    <svg viewBox="0 0 1000 64" preserveAspectRatio="none" id="strip" style="display:none"></svg>
    <svg viewBox="0 0 1000 64" id="stripSvg">
      <g id="stripTicks"></g>
      <line class="scale" x1="0" y1="34" x2="1000" y2="34"/>
      <line class="gap" id="stripGap" x1="0" y1="34" x2="0" y2="34"/>
      <circle id="stripA" cx="0" cy="34" r="5" fill="#f4f4f5"/>
      <circle id="stripB" cx="0" cy="34" r="5" fill="#7ef0cf" style="filter:drop-shadow(0 0 5px #7ef0cf99)"/>
      <text id="stripAT" x="0" y="18" text-anchor="middle">A</text>
      <text id="stripBT" x="0" y="18" text-anchor="middle">B</text>
    </svg>
  </div>
  <input type="file" id="file" accept="audio/*" hidden>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
